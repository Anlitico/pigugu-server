:root {
  --bg: #0b0b0c;
  --fg: #f3eee4;
  --muted: #8c877e;
  --line: #2a2926;
  --glow: #1a2748;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  background: var(--bg);
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  font-weight: 300;
  line-height: 1.4;
  min-height: 100dvh;
}

img { max-width: 100%; height: auto; display: block; }

a { color: inherit; text-decoration: none; }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.grain {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 8;
  opacity: .045;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 6;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 28px;
  mix-blend-mode: difference;
}

.mark {
  letter-spacing: .32em;
  font-weight: 500;
  font-size: 13px;
}

.nav-cta {
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: .8;
}

.hero {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  align-items: center;
  padding: 88px 40px 48px;
  gap: 24px;
}

.hero-copy { animation: rise .9s ease both; }

.kicker {
  font-size: 11px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}

h1 {
  font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  font-weight: 500;
  font-style: normal;
  font-size: clamp(52px, 8vw, 96px);
  line-height: .95;
  letter-spacing: .04em;
}

.lede {
  margin-top: 28px;
  font-size: 18px;
  color: var(--fg);
  max-width: 16em;
}

.notify {
  margin-top: 36px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: center;
  max-width: 420px;
}

.notify input {
  flex: 1 1 200px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
  padding: 10px 0;
  outline: none;
}

.notify input:focus { border-bottom-color: var(--fg); }

.notify button {
  appearance: none;
  border: 0;
  background: var(--fg);
  color: var(--bg);
  font: inherit;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  padding: 12px 18px;
  border-radius: 999px;
  cursor: pointer;
}

.notify button:hover { background: #fff; }

.form-msg {
  flex: 1 1 100%;
  font-size: 13px;
  color: var(--muted);
}

.hero-fig {
  position: relative;
  display: grid;
  place-items: end center;
  animation: rise 1.1s .12s ease both;
}

.hero-fig::before {
  content: "";
  position: absolute;
  width: 70%;
  height: 55%;
  bottom: 8%;
  left: 15%;
  background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 70%);
  filter: blur(40px);
  pointer-events: none;
}

.hero-fig img {
  position: relative;
  width: min(100%, 460px);
  filter: drop-shadow(0 24px 40px #000);
}

.lineup {
  padding: 12px 0 64px;
  border-top: 1px solid var(--line);
}

.lineup-kicker,
.origin-kicker {
  text-align: center;
  font-size: 11px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 28px;
}

.lineup-row {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  overflow-x: auto;
  padding: 0 24px 8px;
  scrollbar-width: none;
}

.lineup-row::-webkit-scrollbar { display: none; }

.lineup-row img {
  height: 156px;
  width: auto;
  flex: 0 0 auto;
  transition: transform .35s ease;
}

.lineup-row img:hover { transform: translateY(-6px); }

.origin {
  padding: 72px 0 80px;
  border-top: 1px solid var(--line);
  scroll-margin-top: 12px;
}

.origin-stills {
  display: grid;
  gap: 8px;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
}

.origin-stills img {
  width: 100%;
  border-radius: 4px;
}

.life {
  display: grid;
  place-items: center;
  padding: 80px 24px;
  gap: 32px;
  background: #efe8dc;
  color: #1c1b18;
}

.life img {
  width: min(640px, 100%);
  border-radius: 4px;
}

.life p {
  font-size: clamp(18px, 2.4vw, 24px);
  font-weight: 300;
  text-align: center;
  letter-spacing: .02em;
  color: #1c1b18;
}

footer {
  display: flex;
  justify-content: space-between;
  padding: 24px 28px 32px;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

@media (max-width: 860px) {
  .nav { padding: 18px 20px; }
  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
    padding: 72px 20px 32px;
    gap: 8px;
  }
  .hero-copy {
    order: 2;
    padding-bottom: 24px;
    text-align: center;
  }
  .lede { margin-inline: auto; }
  .notify { margin-inline: auto; }
  .lineup-row { justify-content: flex-start; }
  .hero-fig { order: 1; }
  .hero-fig img { width: min(62%, 280px); margin-inline: auto; }
  h1 { font-size: clamp(48px, 14vw, 72px); }
  .lineup-row img { height: 112px; }
  .origin-stills { padding: 0 16px; }
  footer { padding-inline: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; }
}

  </style>
</head>
