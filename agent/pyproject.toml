[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # LiveKit Core
    "livekit~=1.0",
    "livekit-agents[silero,turn-detector]~=1.3",
    
    # Plugins
    "livekit-plugins-openai~=1.3",
    "livekit-plugins-deepgram~=1.3",
    "livekit-plugins-cartesia~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    
    # AI Providers
    "dashscope~=1.25",
    "openai~=2.14",
    
    # Audio Processing
    "numpy~=2.3",
    "soundfile~=0.13",
    "sounddevice~=0.5",
    
    # Direct API SDKs (for latency testing)
    "deepgram-sdk~=3.9",
    
    # Configuration
    "pydantic~=2.12",
    "pydantic-settings~=2.12",
    "python-dotenv~=1.2",
    
    # Utilities
    "loguru~=0.7",
    "aiohttp~=3.13",
    
    # Token Server
    "flask~=3.1",
    "flask-cors~=5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "config", 
    "stt",
    "llm",
    "search_adapter",
    "perplexity_search",
    "tts",
    "generate_token",
    "check_token",
    "test_deployment",
    "test_llm_system_prompt",
    "test_latency_us",
    "run_latency_test",
    "terminal_latency_test"
]