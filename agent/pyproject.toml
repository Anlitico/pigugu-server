[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # LiveKit Core
    "livekit~=1.0",
    "livekit-agents[silero,turn-detector]~=1.3",
    
    # Plugins
    "livekit-plugins-openai~=1.3",
    "livekit-plugins-deepgram~=1.3",
    "livekit-plugins-cartesia~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    
    # AI Providers
    "dashscope~=1.25",
    "openai~=2.14",
    
    # Audio Processing
    "numpy~=2.3",
    "soundfile~=0.13",
    "sounddevice~=0.5",
    
    # Direct API SDKs (for latency testing)
    "deepgram-sdk~=3.9",
    
    # Configuration
    "pydantic~=2.12",
    "pydantic-settings~=2.12",
    "python-dotenv~=1.2",
    
    # Utilities
    "loguru~=0.7",
    "aiohttp~=3.13",

]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that call real LLM APIs (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
