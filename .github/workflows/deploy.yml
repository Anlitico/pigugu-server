name: Deploy to Amazon EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR 镜像标签 (例如: latest 或 git commit sha)'
        required: true
        default: 'latest'

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER_NAME: pigugu-cluster
  ECR_REPOSITORY_API: pigugu-api
  ECR_REPOSITORY_AGENT: pigugu-agent

jobs:
  build:
    name: Build and Push
    if: github.event_name == 'push' # 仅在代码推送时自动构建
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push API
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_API:latest -f Dockerfile.api .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:latest

    - name: Build and Push Agent
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:latest -f Dockerfile.agent .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:latest

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'workflow_dispatch' # 仅手动触发时部署
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      run: |
        sed -i "s|image:.*pigugu-api:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG|g" k8s/api.yaml
        sed -i "s|image:.*pigugu-agent:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG|g" k8s/agent.yaml
        kubectl apply -f k8s/api.yaml
        kubectl apply -f k8s/agent.yaml
