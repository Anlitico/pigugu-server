name: Deploy to Amazon EKS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER_NAME: pigugu-cluster
  ECR_REPOSITORY_API: pigugu-api
  ECR_REPOSITORY_AGENT: pigugu-agent

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push API image to Amazon ECR
      id: build-api-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -f Dockerfile.api .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push Agent image to Amazon ECR
      id: build-agent-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG -f Dockerfile.agent .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to EKS
      run: |
        # 使用新的镜像标签替换 YAML 中的占位符
        sed -i "s|image:.*pigugu-api:.*|image: ${{ steps.build-api-image.outputs.image }}|g" k8s/api.yaml
        sed -i "s|image:.*pigugu-agent:.*|image: ${{ steps.build-agent-image.outputs.image }}|g" k8s/agent.yaml
        
        # 应用 Kubernetes 配置
        kubectl apply -f k8s/api.yaml
        kubectl apply -f k8s/agent.yaml
