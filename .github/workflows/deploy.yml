name: Deploy to Amazon EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR Image Tag (e.g., latest or git commit sha)'
        required: true
        default: 'latest'

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER_NAME: pigugu-cluster
  ECR_REPOSITORY_API: pigugu-api
  ECR_REPOSITORY_AGENT: pigugu-agent
  ECR_REPOSITORY_CRAWLER: pigugu-crawler
  ECR_REPOSITORY_TOOLS: pigugu-tools
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Per-image path filter — most pushes only touch one image, so we skip
    # the other 3 builds entirely. Cuts CI from ~10-12min to ~3-4min on
    # typical single-package PRs (see PR history: only #214 of the last 8
    # PRs touched more than one image's source).
    outputs:
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      crawler: ${{ steps.filter.outputs.crawler }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'alembic/**'
              - 'alembic.ini'
              - '.cicd/Dockerfile.api'
            # The agent writes raw SQL into the tables alembic defines
            # (context/storage/pg.py, roast/*), so a schema change must not
            # leave the agent behind. Listing alembic here makes a schema commit
            # publish an agent image under that same tag, so dispatching the tag
            # moves both deployments together. The agent image itself is
            # unaffected — Dockerfile.agent copies neither alembic/ nor
            # alembic.ini, so the build is a cache hit.
            agent:
              - 'pigagent/**'
              - 'alembic/**'
              - 'alembic.ini'
              - '.cicd/Dockerfile.agent'
            crawler:
              - 'crawler/**'
              - 'crawler/Dockerfile'
            tools:
              - 'scripts/**'
              - '.cicd/Dockerfile.tools'

  build:
    name: Build and Push
    if: github.event_name == 'push' # Automate build on code push only
    needs: changes
    # Skip the whole build job if no image source changed (e.g. docs-only push).
    # workflow_dispatch never reaches here anyway — it deploys pre-built images.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push API
      if: needs.changes.outputs.api == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .cicd/Dockerfile.api
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:latest
        # Per-image scope isolates caches — one image's eviction (GHA 10GB
        # repo cap, LRU) can't starve the others. Also makes a cold start
        # of the 700MB agent image much cheaper (~30s vs ~8min) when PR
        # branch caches have been evicted.
        cache-from: type=gha,scope=main-pigugu-api
        cache-to: type=gha,scope=main-pigugu-api,mode=max

    - name: Build and Push Agent
      if: needs.changes.outputs.agent == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .cicd/Dockerfile.agent
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_AGENT }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_AGENT }}:latest
        cache-from: type=gha,scope=main-pigugu-agent
        cache-to: type=gha,scope=main-pigugu-agent,mode=max

    - name: Build and push crawler image
      if: needs.changes.outputs.crawler == 'true'
      uses: docker/build-push-action@v6
      with:
        context: crawler/
        file: crawler/Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_CRAWLER }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_CRAWLER }}:latest
        cache-from: type=gha,scope=main-pigugu-crawler
        cache-to: type=gha,scope=main-pigugu-crawler,mode=max

    - name: Build and push tools image
      if: needs.changes.outputs.tools == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .cicd/Dockerfile.tools
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_TOOLS }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_TOOLS }}:latest
        cache-from: type=gha,scope=main-pigugu-tools
        cache-to: type=gha,scope=main-pigugu-tools,mode=max

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'workflow_dispatch' # Manual deployment only
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Resolve image tags
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      run: |
        # Images are built per package (see the changes job), so a tag exists
        # only in the repositories whose sources changed: one commit publishes
        # an agent image and no api image, the next the reverse. Resolve each
        # deployment to the requested tag where it was published, and otherwise
        # to that repository's :latest — never to a tag nobody published, which
        # only yields ImagePullBackOff.
        if kubectl get deployment/pigugu-api >/dev/null 2>&1; then
          api_current=$(kubectl get deployment/pigugu-api -o jsonpath='{.spec.template.spec.containers[0].image}')
        else
          api_current=   # no deployment yet: first deploy on an empty cluster
        fi
        if kubectl get deployment/pigugu-agent >/dev/null 2>&1; then
          agent_current=$(kubectl get deployment/pigugu-agent -o jsonpath='{.spec.template.spec.containers[0].image}')
        else
          agent_current=
        fi
        # batch-get-image answers a never-published tag with an empty result and
        # exit 0 — unlike describe-images, where "no such tag" and "expired
        # credentials / throttled" are both just a non-zero exit. That
        # difference carries the weight here: a credential failure misread as
        # "not published" would quietly deploy :latest for that service instead
        # of the requested commit, and still report success.
        api_found=$(aws ecr batch-get-image --repository-name $ECR_REPOSITORY_API \
                      --image-ids imageTag=$IMAGE_TAG --query 'length(images)' --output text)
        agent_found=$(aws ecr batch-get-image --repository-name $ECR_REPOSITORY_AGENT \
                        --image-ids imageTag=$IMAGE_TAG --query 'length(images)' --output text)

        api_published=false
        agent_published=false
        api_image=$api_current
        agent_image=$agent_current
        case "$api_found" in
          ''|None)
            echo "ECR returned no usable answer for $ECR_REPOSITORY_API:$IMAGE_TAG — refusing to guess." >&2
            exit 1 ;;
          0)
            # This commit published no api image, so the api is not part of it.
            # Point it at the repository's newest build rather than leaving it:
            # the api's entrypoint runs `alembic upgrade heads` on start and
            # exits if the database knows a revision its image does not, and any
            # alembic change republishes this repository — so :latest is the api
            # that goes with this commit, and the schema and the running api
            # image stay in step.
            api_latest=$(aws ecr batch-get-image --repository-name $ECR_REPOSITORY_API \
                           --image-ids imageTag=latest --query 'length(images)' --output text)
            # Guarded exactly like the lookup above: read as a plain "no
            # :latest" a credentials failure would silently under-deploy the
            # api instead of aborting.
            case "$api_latest" in
              ''|None)
                echo "ECR returned no usable answer for $ECR_REPOSITORY_API:latest — refusing to guess." >&2
                exit 1 ;;
              1)
                api_image=$ECR_REGISTRY/$ECR_REPOSITORY_API:latest
                echo "No $ECR_REPOSITORY_API:$IMAGE_TAG image — api takes $api_image instead." ;;
              *)
                echo "No $ECR_REPOSITORY_API:$IMAGE_TAG image and no :latest either — api stays on ${api_current:-nothing}." >&2 ;;
            esac ;;
          *)
            api_image=$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
            api_published=true ;;
        esac
        case "$agent_found" in
          ''|None)
            echo "ECR returned no usable answer for $ECR_REPOSITORY_AGENT:$IMAGE_TAG — refusing to guess." >&2
            exit 1 ;;
          0)
            agent_latest=$(aws ecr batch-get-image --repository-name $ECR_REPOSITORY_AGENT \
                             --image-ids imageTag=latest --query 'length(images)' --output text)
            case "$agent_latest" in
              ''|None)
                echo "ECR returned no usable answer for $ECR_REPOSITORY_AGENT:latest — refusing to guess." >&2
                exit 1 ;;
              1)
                agent_image=$ECR_REGISTRY/$ECR_REPOSITORY_AGENT:latest
                echo "No $ECR_REPOSITORY_AGENT:$IMAGE_TAG image — agent takes $agent_image instead." ;;
              *)
                echo "No $ECR_REPOSITORY_AGENT:$IMAGE_TAG image and no :latest either — agent stays on ${agent_current:-nothing}." >&2 ;;
            esac ;;
          *)
            agent_image=$ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG
            agent_published=true ;;
        esac
        # Re-dispatching a tag the deployments already run is an ordinary retry,
        # so this asks what ECR published rather than whether the resolved image
        # differs from the running one.
        if [ "$api_published" = false ] && [ "$agent_published" = false ]; then
          echo "Tag $IMAGE_TAG has no image in any repository — nothing to deploy." >&2
          exit 1
        fi
        if [ -z "$api_image" ] || [ -z "$agent_image" ]; then
          echo "No image to run for api or agent — refusing to deploy." >&2
          exit 1
        fi

        echo "API_IMAGE=$api_image" >> "$GITHUB_ENV"
        echo "AGENT_IMAGE=$agent_image" >> "$GITHUB_ENV"

    - name: Run database migrations
      run: |
        # Drop any leftover job first: a previous attempt that could not pull
        # its image would otherwise linger in ImagePullBackOff forever.
        kubectl delete job pigugu-db-migration --ignore-not-found
        # Migrate with the image the api deployment is about to run — never a
        # different one. `alembic upgrade heads` resolves heads in the image it
        # runs, so migrating ahead of that image would leave the new api pod
        # starting against a revision it does not contain: its own entrypoint
        # runs `alembic upgrade heads` and exits, and the pod crashloops.
        sed "s|__IMAGE__|$API_IMAGE|g" k8s/migration-job.yaml | kubectl apply -f -
        if ! kubectl wait --for=condition=complete --timeout=120s job/pigugu-db-migration; then
          echo "=== Migration job logs ==="
          kubectl logs job/pigugu-db-migration
          kubectl delete job pigugu-db-migration --ignore-not-found
          exit 1
        fi
        kubectl logs job/pigugu-db-migration
        kubectl delete job pigugu-db-migration --ignore-not-found

    - name: Deploy ClickHouse infrastructure
      env:
        CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      run: |
        # clickhouse-secret.yaml is the only manifest with placeholders;
        # inject the password and its sha256 hex before applying.
        HASH=$(printf '%s' "$CLICKHOUSE_PASSWORD" | sha256sum | awk '{print $1}')
        sed -e "s|__CLICKHOUSE_PASSWORD__|$CLICKHOUSE_PASSWORD|g" \
            -e "s|__CLICKHOUSE_PASSWORD_SHA256_HEX__|$HASH|g" \
            k8s/clickhouse-secret.yaml | kubectl apply -f -
        kubectl apply -f k8s/clickhouse-storageclass.yaml
        kubectl apply -f k8s/clickhouse-configmap.yaml
        kubectl apply -f k8s/sa-pigugu-s3.yaml
        kubectl apply -f k8s/clickhouse-pvc.yaml
        kubectl apply -f k8s/clickhouse.yaml
        # First deploy provisions a spot node + EBS volume, which can take minutes.
        kubectl rollout status statefulset/clickhouse --timeout=420s

    - name: Run ClickHouse migrations
      # Migration SQL is idempotent (CREATE TABLE IF NOT EXISTS).
      run: |
        kubectl delete job clickhouse-migrate --ignore-not-found
        kubectl apply -f k8s/clickhouse-migration-job.yaml
        if ! kubectl wait --for=condition=complete --timeout=120s job/clickhouse-migrate; then
          echo "=== ClickHouse migration job logs ==="
          kubectl logs job/clickhouse-migrate
          kubectl delete job clickhouse-migrate --ignore-not-found
          exit 1
        fi
        kubectl delete job clickhouse-migrate --ignore-not-found

    - name: Deploy to EKS
      env:
        VOICE_IDLE_SILENCE_SECS: ${{ vars.VOICE_IDLE_SILENCE_SECS }}
        VOICE_LOST_TIMEOUT_SECS: ${{ vars.VOICE_LOST_TIMEOUT_SECS }}
        VOICE_BARE_WAKE_IDLE_SECS: ${{ vars.VOICE_BARE_WAKE_IDLE_SECS }}
        VOICE_WAKE_ACK_WAIT_SECS: ${{ vars.VOICE_WAKE_ACK_WAIT_SECS }}
        DATABASE_URL: postgresql+asyncpg://pigugu:${{ secrets.DB_PASSWORD }}@pigugu-db.c1esma68egsk.us-west-1.rds.amazonaws.com:5432/pigugu
        REDIS_URL: redis://pigugu-redis.feoudk.ng.0001.usw1.cache.amazonaws.com:6379/0
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        DASHSCOPE_US_API_KEY: ${{ secrets.DASHSCOPE_US_API_KEY }}
        ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        AWS_IOT_WEBHOOK_SECRET: ${{ secrets.AWS_IOT_WEBHOOK_SECRET }}
        MQTT_BROKER_URI: ${{ secrets.MQTT_BROKER_URI }}
        CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        OTA_INTERNAL_SECRET: ${{ secrets.OTA_INTERNAL_SECRET }}
      run: |
        # Inject secrets into secrets.yaml
        python - <<'PY'
        import hashlib
        import os
        from pathlib import Path

        path = Path("k8s/secrets.yaml")
        text = path.read_text()

        for key in (
            "DATABASE_URL",
            "REDIS_URL",
            "ANTHROPIC_API_KEY",
            "JWT_SECRET_KEY",
            "LIVEKIT_URL",
            "LIVEKIT_API_KEY",
            "LIVEKIT_API_SECRET",
            "CARTESIA_API_KEY",
            "DEEPGRAM_API_KEY",
            "ASSEMBLYAI_API_KEY",
            "DASHSCOPE_API_KEY",
            "DASHSCOPE_US_API_KEY",
            "ARK_API_KEY",
            "TAVILY_API_KEY",
            "PERPLEXITY_API_KEY",
            "OPENROUTER_API_KEY",
            "XAI_API_KEY",
            "AWS_IOT_WEBHOOK_SECRET",
            "MQTT_BROKER_URI",
            "OTA_INTERNAL_SECRET",
        ):
            text = text.replace(f"__{key}__", os.environ.get(key, ""))

        # ClickHouse password lives as a single plaintext Actions secret;
        # the sha256 hex for users.xml is derived here so the digest is
        # never stored as a separate secret.
        ch_pass = os.environ.get("CLICKHOUSE_PASSWORD", "")
        text = text.replace("__CLICKHOUSE_PASSWORD__", ch_pass)
        text = text.replace(
            "__CLICKHOUSE_PASSWORD_SHA256_HEX__",
            hashlib.sha256(ch_pass.encode()).hexdigest(),
        )

        path.write_text(text)
        PY
        
        # Apply K8s manifests, with the images resolved in their own step above:
        # a service this commit published nothing for keeps the image it is
        # already running rather than floating to the :latest these manifests
        # used to hardcode.
        kubectl apply -f k8s/secrets.yaml
        sed "s|__IMAGE__|$API_IMAGE|g" k8s/api.yaml | kubectl apply -f -
        # agent.yaml's configMap carries the device-idle timers as placeholders
        # injected from Actions variables (code defaults to 30 if a variable is
        # unset — fall back here so the pod never gets an empty value).
        sed -e "s|__IMAGE__|$AGENT_IMAGE|g" \
            -e "s|__VOICE_IDLE_SILENCE_SECS__|${VOICE_IDLE_SILENCE_SECS:-30}|g" \
            -e "s|__VOICE_LOST_TIMEOUT_SECS__|${VOICE_LOST_TIMEOUT_SECS:-30}|g" \
            -e "s|__VOICE_BARE_WAKE_IDLE_SECS__|${VOICE_BARE_WAKE_IDLE_SECS:-30}|g" \
            -e "s|__VOICE_WAKE_ACK_WAIT_SECS__|${VOICE_WAKE_ACK_WAIT_SECS:-2}|g" \
            k8s/agent.yaml | kubectl apply -f -
        kubectl apply -f k8s/fluent-bit.yaml
        kubectl apply -f crawler/deploy/cronjob.yaml
        # Remove old trump-crawler if it still exists
        kubectl delete cronjob trump-crawler --ignore-not-found

        # Force a restart to ensure fresh image is pulled (especially if tag is
        # 'latest'). Both services unconditionally: a deployment whose pod
        # template is otherwise unchanged still needs the restart to pick up a
        # moved floating tag, a changed ConfigMap (envFrom is read at container
        # start) or a changed Secret. Making this conditional on the image
        # string would silently skip all three.
        kubectl rollout restart deployment/pigugu-api
        kubectl rollout restart deployment/pigugu-agent

        # Wait for rollout to complete
        kubectl rollout status deployment/pigugu-api
        kubectl rollout status deployment/pigugu-agent
