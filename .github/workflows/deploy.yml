name: Deploy to Amazon EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR Image Tag (e.g., latest or git commit sha)'
        required: true
        default: 'latest'

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER_NAME: pigugu-cluster
  ECR_REPOSITORY_API: pigugu-api
  ECR_REPOSITORY_AGENT: pigugu-agent
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Push
    if: github.event_name == 'push' # Automate build on code push only
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push API
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_API:latest -f Dockerfile.api .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:latest

    - name: Build and Push Agent
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:latest -f Dockerfile.agent .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AGENT:latest

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'workflow_dispatch' # Manual deployment only
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DATABASE_HOST: ${{ vars.DATABASE_HOST }}
        DATABASE_USER: ${{ vars.DATABASE_USER }}
        DATABASE_NAME: ${{ vars.DATABASE_NAME }}
        DATABASE_PORT: ${{ vars.DATABASE_PORT }}
        REDIS_URL: ${{ vars.REDIS_URL }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        DASHSCOPE_US_API_KEY: ${{ secrets.DASHSCOPE_US_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        AWS_IOT_WEBHOOK_SECRET: ${{ secrets.AWS_IOT_WEBHOOK_SECRET }}
        MQTT_BROKER_URI: ${{ secrets.MQTT_BROKER_URI }}
        BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      run: |
        # Inject real database URL into secrets.yaml
        sed -i "s|__DATABASE_URL__|postgresql+asyncpg://${DATABASE_USER}:${DB_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}|g" k8s/secrets.yaml

        # Inject agent secrets into secrets.yaml
        python - <<'PY'
        import os
        from pathlib import Path

        path = Path("k8s/secrets.yaml")
        text = path.read_text()

        for key in (
            "REDIS_URL",
            "BRIGHTDATA_API_KEY",
            "JWT_SECRET_KEY",
            "LIVEKIT_URL",
            "LIVEKIT_API_KEY",
            "LIVEKIT_API_SECRET",
            "CARTESIA_API_KEY",
            "DEEPGRAM_API_KEY",
            "XAI_API_KEY",
            "DASHSCOPE_API_KEY",
            "DASHSCOPE_US_API_KEY",
            "PERPLEXITY_API_KEY",
            "OPENROUTER_API_KEY",
            "AWS_IOT_WEBHOOK_SECRET",
            "MQTT_BROKER_URI",
        ):
            text = text.replace(f"__{key}__", os.environ.get(key, ""))

        path.write_text(text)
        PY
        
        # Apply K8s manifests
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/api.yaml
        kubectl apply -f k8s/agent.yaml
        kubectl apply -f k8s/crawler-cronjob.yaml
        
        # Update image
        kubectl set image deployment/pigugu-api api=$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        kubectl set image deployment/pigugu-agent agent=$ECR_REGISTRY/$ECR_REPOSITORY_AGENT:$IMAGE_TAG
        
        # Force a restart to ensure fresh image is pulled (especially if tag is 'latest')
        kubectl rollout restart deployment/pigugu-api
        kubectl rollout restart deployment/pigugu-agent

        # Wait for rollout to complete
        kubectl rollout status deployment/pigugu-api
        kubectl rollout status deployment/pigugu-agent
