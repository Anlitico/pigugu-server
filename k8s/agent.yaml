apiVersion: v1
kind: ConfigMap
metadata:
  name: pigugu-agent-config
data:
  STT_PROVIDER: "assemblyai"
  LLM_MODEL: "grok-4-3"
  CARTESIA_TTS_MODEL: "sonic-3.5"
  POLICY_SEARCH_BACKEND: "built_in"
  AGENT_MODE: "1"
  DEEPGRAM_ENABLE_DIARIZATION: "true"
  ENDPOINTING_DELAY: "0.5"
  ENABLE_POLICY_SEARCH: "true"
  FORCE_POLICY_SEARCH: "false"
  AWS_REGION: "us-west-1"
  LOG_LEVEL: "INFO"
  LOG_TO_FILE: "false"
  # ClickHouse voice.turns (see k8s/clickhouse.yaml). asynch uses the
  # native protocol on port 9000, not the HTTP interface on 8123.
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_DATABASE: "voice"
  CLICKHOUSE_TABLE: "voice.turns"
  # S3 audio storage (see k8s/sa-pigugu-s3.yaml for the IRSA role).
  AUDIO_S3_BUCKET: "pigugu-clickhouse-audio"
  AUDIO_S3_PREFIX: "voice-turns"
  # Feature flag — set "false" to disable the new S3+ClickHouse path
  # entirely (turns still go through the legacy /tmp WAV saves).
  ENABLE_TURN_STORAGE: "true"
  # Metrics exporter (metrics/*.py): routes per-turn/compression telemetry to
  # the CH `metrics` database. Off by default in code — keep ON in prod.
  ENABLE_METRICS_EXPORT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigugu-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pigugu-agent
  template:
    metadata:
      labels:
        app: pigugu-agent
    spec:
      # IRSA service account for S3 access to the audio bucket.
      # Trust policy and IAM role must be configured per
      # k8s/sa-pigugu-s3.yaml BEFORE this pod can write audio.
      serviceAccountName: pigugu-s3-sa
      containers:
      - name: agent
        image: 537557168531.dkr.ecr.us-west-1.amazonaws.com/pigugu-agent:latest
        envFrom:
        - configMapRef:
            name: pigugu-agent-config
        ports:
        - containerPort: 8080
          name: ws
        - containerPort: 8081
          name: http
        imagePullPolicy: Always
        env:
        - name: LIVEKIT_URL
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: LIVEKIT_URL
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: LIVEKIT_API_KEY
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: LIVEKIT_API_SECRET
        - name: CARTESIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: CARTESIA_API_KEY
        - name: DEEPGRAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: DEEPGRAM_API_KEY
        - name: ASSEMBLYAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: ASSEMBLYAI_API_KEY
        - name: DASHSCOPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: DASHSCOPE_API_KEY
        - name: DASHSCOPE_US_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: DASHSCOPE_US_API_KEY
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: PERPLEXITY_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: OPENROUTER_API_KEY
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: XAI_API_KEY
        - name: ARK_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: ARK_API_KEY
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: TAVILY_API_KEY
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: REDIS_URL
        - name: AWS_IOT_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: AWS_IOT_ENDPOINT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: DATABASE_URL
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              # Single source of truth for the ClickHouse password
              # (see k8s/clickhouse-secret.yaml). The same Secret
              # also holds the sha256-hex for the StatefulSet
              # initContainer, so the two consumers cannot drift.
              name: clickhouse-password
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: pigugu-agent
spec:
  type: ClusterIP
  selector:
    app: pigugu-agent
  ports:
  - port: 8080
    targetPort: 8080
    name: ws
  - port: 8081
    targetPort: 8081
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: pigugu-agent-nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-west-1:537557168531:certificate/48b5e4af-c516-4d7c-88ed-3e424233e201
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: pigugu-agent
  ports:
  - port: 443
    targetPort: 8080
    name: https
  - port: 8080
    targetPort: 8080
    name: plain-tcp
