apiVersion: v1
kind: Secret
metadata:
  name: pigugu-secrets
type: Opaque
stringData:
  # Replace with your actual RDS endpoint
  DATABASE_URL: "postgresql+asyncpg://pigugu:pigugu@your-rds-endpoint:5432/pigugu"
  # Replace with your actual ElastiCache endpoint
  REDIS_URL: "redis://your-redis-endpoint:6379/0"
