# ClickHouse password Secret template.
#
# BEFORE applying: fill in both fields. Generate with:
#   PASS=$(openssl rand -hex 16)
#   HASH=$(printf '%s' "$PASS" | sha256sum | awk '{print $1}')
#   kubectl create secret generic clickhouse-password \
#     --from-literal=password="$PASS" \
#     --from-literal=password-sha256-hex="$HASH" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The initContainer in clickhouse.yaml patches users.xml with the
# sha256 hex so the server accepts the password from the agent.
# The plaintext `password` is consumed by the agent pod via the
# CLICKHOUSE_PASSWORD env var and the migration Job.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-password
type: Opaque
stringData:
  # Plaintext password. The agent reads this for the asynch client.
  password: "__CLICKHOUSE_PASSWORD__"
  # SHA-256 hex digest of the same password. The initContainer in the
  # ClickHouse StatefulSet substitutes this into users.xml.
  password-sha256-hex: "__CLICKHOUSE_PASSWORD_SHA256_HEX__"
