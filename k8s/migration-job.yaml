apiVersion: batch/v1
kind: Job
metadata:
  name: pigugu-db-migration
spec:
  template:
    spec:
      containers:
      - name: migration
        # 使用和你 API 相同的镜像
        image: 537557168531.dkr.ecr.us-west-1.amazonaws.com/pigugu-api:latest
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pigugu-secrets
              key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 2
