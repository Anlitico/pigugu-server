# ClickHouse StatefulSet + Service for voice.turns.
#
# Architecture: single-replica v1 on c7g.large spot. Loses the index
# on a spot reclaim; the audio in S3 stays safe. v2 adds clickhouse-keeper
# + 2 replicas across 2 AZs (see docs/clickhouse-audio-storage.md).
#
# Resources: c7g.large has 2 vCPU / 4 GiB RAM. We request 1.5 CPU / 3 Gi
# and cap at 2 CPU / 3.5 Gi. The max_server_memory_usage in config.xml
# is 3 GB to leave headroom for the OS and other containers.
#
# Taints / nodeSelector: dedicated to the ng-clickhouse node group
# (c7g.large spot, arm64, taint `workload=clickhouse:NoSchedule`,
# label `workload=clickhouse`).
#
# Password injection: an initContainer reads CLICKHOUSE_PASSWORD_HASH
# from a Secret and patches users.xml on the emptyDir that is then
# mounted into /etc/clickhouse-server/config.d/.
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      nodeSelector:
        workload: clickhouse
        kubernetes.io/arch: arm64
      tolerations:
      - key: workload
        operator: Equal
        value: clickhouse
        effect: NoSchedule
      # An emptyDir is used as the config.d/ mount point so the
      # initContainer can rewrite users.xml with the real password
      # before the main container starts.
      initContainers:
      - name: patch-users-xml
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          SECRET_HASH="$(cat /secret/clickhouse-password-hash)"
          if [ -z "$SECRET_HASH" ]; then
            echo "ERROR: empty password hash from secret"
            exit 1
          fi
          # Replace the placeholder in users.xml. The default
          # ConfigMap ships the string PLACEHOLDER_REPLACED_BY_INITCONTAINER
          # which we substitute with the SHA-256 hex from the Secret.
          sed "s/PLACEHOLDER_REPLACED_BY_INITCONTAINER/${SECRET_HASH}/" \
            /configmap/users.xml > /rendered/users.xml
          echo "Patched users.xml with password hash (length=${#SECRET_HASH})"
        volumeMounts:
        - name: configmap-source
          mountPath: /configmap
        - name: rendered-config
          mountPath: /rendered
        env:
        - name: SECRET_HASH
          valueFrom:
            secretKeyRef:
              name: clickhouse-password
              key: password-sha256-hex
      containers:
      - name: clickhouse
        # Use the multi-arch (linux/amd64,linux/arm64) official image.
        image: clickhouse/clickhouse-server:24.3
        ports:
        - name: http
          containerPort: 8123
        - name: native
          containerPort: 9000
        resources:
          requests:
            cpu: "1500m"
            memory: "3Gi"
          limits:
            cpu: "2000m"
            memory: "3.5Gi"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: CLICKHOUSE_DB
          value: voice
        - name: CLICKHOUSE_USER
          value: default
        # NOTE: CLICKHOUSE_PASSWORD is intentionally NOT set on the
        # clickhouse server container. The server authenticates via
        # the sha256-hash already patched into users.xml by the
        # initContainer (see top of this manifest). The plaintext
        # password is only needed by the agent and the migration
        # Job, both of which read it directly from the
        # clickhouse-password Secret.
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: rendered-config
          mountPath: /etc/clickhouse-server/config.d/users.xml
          subPath: users.xml
        - name: configmap-source
          mountPath: /etc/clickhouse-server/config.d/config.xml
          subPath: config.xml
        - name: configmap-source
          mountPath: /etc/clickhouse-server/config.d/storage.xml
          subPath: storage.xml
        - name: clickhouse-logs
          mountPath: /var/log/clickhouse-server
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clickhouse-data
      - name: configmap-source
        configMap:
          name: clickhouse-config
      - name: rendered-config
        emptyDir: {}
      - name: clickhouse-logs
        emptyDir: {}
