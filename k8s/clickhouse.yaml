# ClickHouse StatefulSet + Service for voice.turns.
#
# Architecture: single-replica v1 on c7g.large spot. Loses the index
# on a spot reclaim; the audio in S3 stays safe. v2 adds clickhouse-keeper
# + 2 replicas across 2 AZs (see docs/clickhouse-audio-storage.md).
#
# Resources: c7g.large has 2 vCPU / 4 GiB RAM, but ~3.06 GiB allocatable
# after kube/system-reserved (aws-node, ebs-csi-node, kube-proxy also run
# here). We request 1.5 CPU / 2 Gi and cap at 2 CPU / 2.5 Gi. The
# max_server_memory_usage in config.xml is 2 GB to stay inside the pod
# limit with headroom for ClickHouse's own overhead.
#
# Taints / nodeSelector: dedicated to the ng-clickhouse node group
# (c7g.large spot, arm64, taint `workload=clickhouse:NoSchedule`,
# label `workload=clickhouse`).
#
# Password injection: an initContainer reads CLICKHOUSE_PASSWORD_HASH
# from a Secret and patches users.xml on the emptyDir that is then
# mounted into /etc/clickhouse-server/config.d/.
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  type: ClusterIP
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      nodeSelector:
        workload: clickhouse
        kubernetes.io/arch: arm64
      tolerations:
      - key: workload
        operator: Equal
        value: clickhouse
        effect: NoSchedule
      # An emptyDir is used as the staging mount point so the
      # initContainer can rewrite users.xml with the real password
      # before the main container starts. The rendered file REPLACES
      # the image's base /etc/clickhouse-server/users.xml entirely —
      # ClickHouse loads users from <users_config> (users.xml + users.d/),
      # NOT from config.d/, so dropping our users.xml into config.d/
      # would be silently ignored (the base file's empty <password>
      # would win the merge).
      initContainers:
      - name: patch-users-xml
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -z "${SECRET_HASH}" ]; then
            echo "ERROR: empty password hash from secret"
            exit 1
          fi
          # Replace the placeholder in users.xml. The default
          # ConfigMap ships the string PLACEHOLDER_REPLACED_BY_INITCONTAINER
          # which we substitute with the SHA-256 hex from the Secret.
          sed "s/PLACEHOLDER_REPLACED_BY_INITCONTAINER/${SECRET_HASH}/" \
            /configmap/users.xml > /rendered/users.xml
          echo "Patched users.xml with password hash (length=${#SECRET_HASH})"
        volumeMounts:
        - name: configmap-source
          mountPath: /configmap
        - name: rendered-config
          mountPath: /rendered
        env:
        - name: SECRET_HASH
          valueFrom:
            secretKeyRef:
              name: clickhouse-password
              key: password-sha256-hex
      containers:
      - name: clickhouse
        # Use the multi-arch (linux/amd64,linux/arm64) official image.
        image: clickhouse/clickhouse-server:24.3
        ports:
        - name: http
          containerPort: 8123
        - name: native
          containerPort: 9000
        resources:
          requests:
            cpu: "1500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "2.5Gi"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: CLICKHOUSE_DB
          value: voice
        - name: CLICKHOUSE_USER
          value: default
        # CLICKHOUSE_PASSWORD is REQUIRED on the server container: the
        # clickhouse/clickhouse-server image's entrypoint, when neither
        # CLICKHOUSE_USER nor CLICKHOUSE_PASSWORD is set, writes a
        # users.d file that restricts the default user to localhost only
        # (blocking the agent's cross-node connections). With the
        # password set, the entrypoint writes users.d/default.xml with
        # the sha256 hex and an allow-all networks entry. The
        # initContainer additionally patches our own replaced users.xml
        # so the effective config is consistent regardless of entrypoint
        # behavior. The agent and migration Job read the same plaintext
        # from the clickhouse-password Secret.
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-password
              key: password
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: rendered-config
          mountPath: /etc/clickhouse-server/users.xml
          subPath: users.xml
        - name: configmap-source
          mountPath: /etc/clickhouse-server/config.d/config.xml
          subPath: config.xml
        - name: configmap-source
          mountPath: /etc/clickhouse-server/config.d/storage.xml
          subPath: storage.xml
        - name: clickhouse-logs
          mountPath: /var/log/clickhouse-server
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clickhouse-data
      - name: configmap-source
        configMap:
          name: clickhouse-config
      - name: rendered-config
        emptyDir: {}
      - name: clickhouse-logs
        emptyDir: {}
