[project]
name = "pigugu-crawler"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.50.0",            # Anthropic SDK → DeepSeek V4 /anthropic endpoint
    "feedparser>=6.0.0",            # RSS feed parsing
    "sqlalchemy[asyncio]>=2.0.0",   # ORM + async
    "asyncpg>=0.29.0",              # PostgreSQL driver
    "httpx>=0.27.0",                # HTTP client for RSS fetching
    "pydantic>=2.12",               # Data validation
    "pydantic-settings>=2.14",       # Env-based config
    "python-dotenv>=1.2",           # .env loading
    "loguru>=0.7",                  # Structured logging
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
