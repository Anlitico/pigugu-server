# Pigugu Agent — Model configuration
# [id]       model ID used in code (e.g., LLM_MODEL env var)
# provider   must match a [name] in providers.toml
# api_model  actual model name sent to the API (defaults to id)
# display    human-readable name for logs
# context    context window size in tokens
# output     max output tokens
# capabilities: text, streaming, tool_use, web_search
# thinking   whether thinking/reasoning mode is supported
# search     whether built-in web search is supported

[qwen-plus-us]
provider = "qwen-us"
api_model = "qwen-plus"
display = "Qwen Plus (US)"
context = 1000000
output = 32768
capabilities = ["text", "streaming", "tool_use", "web_search"]
thinking = true
search = true

# NOTE: qwen3.6-plus / qwen3.6-flash removed — they don't support implicit KV cache
# (x-dashscope-session-cache). They require manual cache_control per content block,
# which doesn't work for our multi-turn conversation pattern.
# See: https://www.alibabacloud.com/help/en/model-studio/context-cache

[qwen-plus-cn]
provider = "qwen-cn"
api_model = "qwen-plus"
display = "Qwen Plus (China)"
context = 1000000
output = 32768
capabilities = ["text", "streaming", "tool_use", "web_search"]
thinking = true
