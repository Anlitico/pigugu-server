# Pigugu Agent — Model configuration
# Add new models by appending a [[models]] block
# Format: id = unique identifier under provider/namespace

[[models]]
id = "qwen-plus"
provider = "qwen-us"
display = "Qwen Plus"
context = 1000000
output = 32768
capabilities = ["text", "streaming", "tool_use", "web_search"]
thinking = true
search = true


# NOTE: qwen3.6-plus / qwen3.6-flash removed — they don't support implicit KV cache
# (x-dashscope-session-cache). They require manual cache_control per content block,
# which doesn't work for our multi-turn conversation pattern.
# See: https://www.alibabacloud.com/help/en/model-studio/context-cache

[[models]]
id = "doubao-seed-1-6-251015"
provider = "volcengine"
display = "Doubao Seed 1.6"
context = 256000
output = 16384
capabilities = ["text", "streaming", "tool_use"]
thinking = true
search = false

