# Provider configuration — add new providers here
# [name]    must match the provider field in models.toml
# base_url  API endpoint (US/international)
# env       environment variable for API key
# default   default model when user does not specify one

[qwen-us]
base_url = "https://dashscope-us.aliyuncs.com/compatible-mode/v1"
env = "DASHSCOPE_US_API_KEY"
default = "qwen3.6-plus"

[volcengine]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
env = "ARK_API_KEY"
default = "doubao-seed-1-6-251015"

