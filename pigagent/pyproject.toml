[project]
name = "pigagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Standalone VAD (ONNX Runtime — official xiaozhi approach)
    "onnxruntime>=1.18",
    # AI Providers
    "dashscope~=1.25",
    "openai~=2.38",
    # Audio Processing
    "opuslib>=3.0",
    "numpy~=2.4",
    "soundfile~=0.13",
    "sounddevice~=0.5",
    # Direct API SDKs (for latency testing)
    "deepgram-sdk~=7.2",
    "cartesia~=3.2",
    # Configuration
    "pydantic~=2.12",
    "pydantic-settings~=2.14",
    "python-dotenv~=1.2",
    # HTTP API
    "fastapi~=0.136",
    "uvicorn[standard]~=0.48",
    # WebSocket server (official xiaozhi pattern)
    "websockets>=13.0",
    # Storage
    "redis~=7.4",
    "asyncpg~=0.31",
    # Search SDKs
    "tavily-python~=0.7",
    # AWS IoT (MQTT publish for device communication)
    "boto3>=1.34.0",
    "aioboto3>=13.0",  # async S3 for TurnStorage uploads
    "asynch>=0.4",  # async ClickHouse driver; connect() is sync since 0.4
    # Utilities
    "loguru~=0.7",
    "aiohttp~=3.13",
    "jinja2~=3.1",
    "json-repair>=0.59.10",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
norecursedirs = [".venv"]
markers = [
    "integration: marks tests that call real LLM APIs (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "alembic>=1.18",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

