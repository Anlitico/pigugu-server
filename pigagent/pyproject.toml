[project]
name = "pigagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # LiveKit Core
    "livekit~=1.0",
    "livekit-agents[silero,turn-detector]~=1.3",
    # Plugins
    "livekit-plugins-openai~=1.3",
    "livekit-plugins-deepgram~=1.3",
    "livekit-plugins-cartesia~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    # AI Providers
    "dashscope~=1.25",
    "openai~=2.38",
    # Audio Processing
    "numpy~=2.4",
    "soundfile~=0.13",
    "sounddevice~=0.5",
    # Direct API SDKs (for latency testing)
    "deepgram-sdk~=7.2",
    # Configuration
    "pydantic~=2.12",
    "pydantic-settings~=2.14",
    "python-dotenv~=1.2",
    # HTTP API
    "fastapi~=0.136",
    "uvicorn[standard]~=0.48",
    # Storage
    "redis~=7.4",
    "asyncpg~=0.31",
    # Search SDKs
    "tavily-python~=0.7",
    # Utilities
    "loguru~=0.7",
    "aiohttp~=3.13",
    "jinja2~=3.1",
    "json-repair>=0.59.10",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
norecursedirs = [".venv"]
markers = [
    "integration: marks tests that call real LLM APIs (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "alembic>=1.18",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

