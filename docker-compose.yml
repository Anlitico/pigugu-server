# Local development only — NOT used in CI/CD pipeline
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pigugu
      POSTGRES_PASSWORD: pigugu
      POSTGRES_DB: pigugu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigugu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: .cicd/Dockerfile.api.local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pigugu:pigugu@postgres:5432/pigugu
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./firebase-credentials.json:/api/firebase-credentials.json:ro
      - ./api:/api
      - ./alembic:/api/alembic
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  agent:
    build:
      context: .
      dockerfile: .cicd/Dockerfile.agent.local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pigugu:pigugu@postgres:5432/pigugu
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs/pigagent:/pigagent/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
